[project]
name = "sywi-core"
version = "0.1.0"
description = "Shared utilities (Lance IO manager) for SYWI data platform"
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-postgres",
    "lancedb",
    "pandas",
    "pyarrow",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
