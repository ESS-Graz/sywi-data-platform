[project]
name = "sywi-duckdb"
version = "0.1.0"
description = "DuckDB wrapper with auto-configured SYWI Lance connections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
