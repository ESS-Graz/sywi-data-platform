# Ikariam Pipeline Configuration
# ================================

# Database connection settings
database:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "root"

# Reference timestamp for play duration calculation
# November 14, 2014 00:00:00 UTC
reference_timestamp: 1415923200

# Minimum play duration to include players in final datasets (days).
# Legacy V1 R filter; SQL uses min_registration_time instead (see below).
min_play_duration_days: 2

# Prelaunch player filter: drop players whose registration_time is before the
# earliest possible server start time. Legacy SQL name: Q28_Delete_Players.
# Value: 2013-04-25 10:00:00 UTC = 1366797600 unix seconds. Filter applies to
# players AND their cities/donations across all downstream aggregations.
min_registration_time: 1366797600

# Play duration adjustment factors
# Adjusts resource values based on how long a player has been active
# to account for inflation/game changes over time
duration_adjustments:
  - max_seconds: 180000      # ~2 days
    factor: 1.00
  - max_seconds: 1440000     # ~16.7 days
    factor: 0.98
  - max_seconds: 13149000    # ~152 days
    factor: 0.94
  - max_seconds: .inf        # unlimited
    factor: 0.86

# Wonder donation split factor
# When donating to wonder, 66.67% goes to non-matching luxury resources
wonder_split_factor: 0.666667

# Countries to process
# Start with DE only, add others later
countries:
  - DE
  # - EN
  # - FR
  # - GR
  # - TR

